# Release rail: push a source tag vX.Y.Z → this builds dists, runs the full
# test suite, and publishes an immutable vX.Y.Z-dist tag that consumers pin:
#   "thumbmux": "github:kemkem23/thumbmux#vX.Y.Z-dist"
# (bun blocks git-dep postinstall and skips workspace devDeps, so dists must
# ship inside the tag — build-on-install does not work for git dependencies.)
name: release-dist
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: release tag matches package manifests
        run: bun scripts/check-release-version.ts
      - name: 1.0 is a no-code-delta retag
        run: bun scripts/check-release-retag.ts
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun install --frozen-lockfile
      - name: install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      # Artifact tests in the suite below read git-dist. Build it first — see the
      # matching comment in ci.yml. The later "build release dists" step rebuilds
      # it deterministically, so this does not change what ships.
      - name: build git-dist for the artifact tests
        run: bun run build:git-dist
      # `--timeout` fails an individual test by name; the step ceiling is the
      # backstop for a wait that belongs to no single test.
      #
      # The ceiling is 60 minutes and that is not padding. This suite installs
      # real consumer fixtures over the network and drives a real browser, and a
      # 2-core runner does not resemble the 16-core box where it finishes in
      # 101 seconds. A first attempt at 15 minutes killed three releases in a
      # row and taught nothing — every "hang" it reported was this step being
      # slow, and cutting it short only removed the evidence.
      - name: unit and contract suites
        timeout-minutes: 60
        run: bun test --timeout 120000 ./server/tests/*.test.ts ./core/tests/*.test.ts ./core/src/*.test.ts ./svelte/tests/*.test.ts ./app/tests/*.test.ts ./demo/*.test.ts ./scripts/*.test.ts
      - name: demo builds
        run: cd demo && bun run build
      - name: reject focused Playwright tests
        run: ./node_modules/.bin/playwright test --config=e2e/playwright.config.ts --list --forbid-only
        env:
          DEMO_URL: http://127.0.0.1:1
      - name: canonical container e2e
        timeout-minutes: 20
        run: ./e2e/run-container.sh
        env:
          THUMBMUX_E2E_ARTIFACTS: ${{ runner.temp }}/thumbmux-e2e-release
      - name: retain e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbmux-e2e-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/thumbmux-e2e-release
          if-no-files-found: ignore
          retention-days: 7
      - name: build release dists
        run: bun run build:git-dist
      - name: root git-dist consumer smoke
        run: bun run smoke:git-dist
      - name: materialize immutable prior contract
        run: |
          baseline_root="$RUNNER_TEMP/thumbmux-contract-baseline"
          bun scripts/materialize-contract-baseline.ts "$baseline_root"
          echo "THUMBMUX_CONTRACT_BASELINE_ROOT=$baseline_root" >> "$GITHUB_ENV"
          echo "THUMBMUX_CONTRACT_REQUIRE_BASELINE=1" >> "$GITHUB_ENV"
      - name: public API contract gate
        # Check the surface of the release artifact before exercising the
        # frozen consumers that depend on it.
        run: bun run contract
      - name: frozen consumer contract gate
        # Keep this after build:git-dist and before the commit/tag/push step.
        # The app-host fixture uses the Chromium installed above.
        run: bash scripts/contract-fixtures.sh
      - name: commit dists and push ${GITHUB_REF_NAME}-dist
        run: |
          git config user.name "thumbmux-release"
          git config user.email "noreply@github.com"
          # Dists ship prebuilt in this tag. The root artifact is read-only:
          # remove every lifecycle/demo/build script so no package manager
          # rebuilds it or advertises commands whose sources are not shipped.
          # The smoke rail calls this same helper before npm pack, so its
          # advertised files/exports cannot drift from the released manifest.
          bun scripts/prepare-release-package.ts .
          # Keep pristine scoped-package dists available to pack from this tag;
          # the root files whitelist still installs only git-dist + docs.
          git add -f core/dist server/dist svelte/dist app/dist git-dist package.json
          git commit -m "release: ${GITHUB_REF_NAME} + prebuilt git dist"
          git tag "${GITHUB_REF_NAME}-dist"
          git push origin "${GITHUB_REF_NAME}-dist"
