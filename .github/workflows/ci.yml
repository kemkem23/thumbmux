name: ci
on:
  push:
    branches: [main, maintenance/0.16.5]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Shared verification gate — same composite action that release-dist runs.
      # Do not re-inline unit/e2e/contract steps here; see
      # .github/actions/verify-gate/action.yml and scripts/release-rails.test.ts.
      - uses: ./.github/actions/verify-gate
        with:
          e2e-artifact-suffix: ci
