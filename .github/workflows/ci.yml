name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun install --frozen-lockfile
      - name: install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      # The suite includes tests that assert properties of the shipped artifact
      # (dist hygiene, the README quickstart pack). They need git-dist to exist
      # before they run. On a developer machine it is usually lying around from
      # an earlier build, which is exactly how they passed locally for the whole
      # of v0.8.0 while failing on the first clean checkout CI ever gave them.
      - name: build git-dist for the artifact tests
        run: bun run build:git-dist
      - name: core unit tests
        run: bun test ./core/tests/ ./core/src/*.test.ts
      - name: protocol conformance (real tmux)
        run: bun test ./server/tests/
      - name: svelte + app + demo unit tests
        run: bun test ./svelte/tests/ ./app/tests/ ./demo/*.test.ts ./scripts/*.test.ts
      # Release-parity gate: must stay byte-identical to the unit-test command
      # in release.yml. Split suite steps above give better failure locality;
      # this combined process is what release-dist actually runs, and a
      # DOM-harness / preload interaction can fail only under one process.
      - name: release-parity combined unit tests
        run: bun test ./server/tests/*.test.ts ./core/tests/*.test.ts ./core/src/*.test.ts ./svelte/tests/*.test.ts ./app/tests/*.test.ts ./demo/*.test.ts ./scripts/*.test.ts
      - name: demo builds
        run: cd demo && bun run build
      - name: canonical container e2e
        timeout-minutes: 20
        run: ./e2e/run-container.sh
        env:
          THUMBMUX_E2E_ARTIFACTS: ${{ runner.temp }}/thumbmux-e2e-ci
      - name: retain e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbmux-e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/thumbmux-e2e-ci
          if-no-files-found: ignore
          retention-days: 7
      - name: packages build & pack (publish readiness)
        run: |
          (cd core && bun run build && bun pm pack)
          (cd server && bun run build && bun pm pack)
          (cd svelte && bun run build && bun pm pack)
          (cd app && bun run build && bun pm pack)
      - name: root git-dist consumer smoke
        run: bun run build:git-dist && bun run smoke:git-dist
      - name: public API contract gate
        # Runs against the git-dist built in the step above, not against source:
        # the contract is what a consumer receives. Fails when a public name
        # changes signature or appears without a declared tier.
        run: bun run contract
      - name: frozen consumer contract gate
        # Packs that same git-dist and exercises all frozen consumers. Chromium
        # was installed above for the app-host runtime fixture.
        run: bash scripts/contract-fixtures.sh
