# Shared verification gate for `ci` and `release-dist`.
#
# Why a composite action (not a reusable workflow, not only a shell script):
# - release needs version/retag checks BEFORE the gate and commit/tag/push AFTER
#   — a reusable workflow is a whole job and cannot sandwich those steps cleanly
# - the gate needs Actions-native pieces (setup-bun, upload-artifact, GITHUB_ENV)
#   that a plain script cannot own without re-implementing half of Actions
# - a single local `uses: ./.github/actions/verify-gate` means the two workflows
#   cannot green independently with different step lists (the 2026-08-06 failure
#   mode that burned v0.10.0-dist and v0.11.0-dist while ci was red)
#
# `scripts/ci-parity.sh` mirrors this command sequence only in this public
# disposable job. A monorepo call enters the canonical hard sandbox and reports
# INCOMPLETE before Docker/network/tmux/browser lifecycle can start.
name: verify-gate
description: >
  Full verification suite shared by ci and release-dist. Own every gate that
  must pass before a commit is considered releasable.
inputs:
  e2e-artifact-suffix:
    description: Suffix for e2e artifact names/paths (e.g. ci or release)
    required: true
runs:
  using: composite
  steps:
    # Playwright's CLI is a Node program. Pin both the action implementation and
    # the exact supported Node security release so a runner-image PATH change
    # cannot silently select a different interpreter. Keep caching disabled:
    # Bun's frozen lock owns dependency installation below.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.23.2
        check-latest: false
    # Pinned on purpose. Unpinned, setup-bun installs whatever shipped today,
    # so the gate can go red with no commit of ours — and did: bun 1.3.14 hangs
    # demo/dogfooding.test.ts (bun 1.3.11 runs the same file in 4.6s), which
    # burned five release attempts before anyone looked at the toolchain.
    # Single source of truth: ci-parity.sh greps bun-version from THIS file.
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.11
    - run: sudo apt-get update && sudo apt-get install -y tmux
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
    - run: bun install --frozen-lockfile
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
    - name: install Playwright Chromium
      run: |
        thumbmux_node_bin=/opt/hostedtoolcache/node/22.23.2/x64/bin/node
        playwright_entry="$PWD/node_modules/@playwright/test/cli.js"
        playwright_cli="$(/usr/bin/realpath -e -- "$playwright_entry")"
        [[ -x "$thumbmux_node_bin" && ! -L "$thumbmux_node_bin" \
          && "$("$thumbmux_node_bin" --version)" == v22.23.2 ]]
        case "$playwright_cli" in
          "$PWD/node_modules/@playwright/test/cli.js"|"$PWD/node_modules/.bun/@playwright+test@1.61.1/node_modules/@playwright/test/cli.js") ;;
          *) printf 'verify-gate: Playwright CLI escaped the frozen dependency tree\n' >&2; exit 2 ;;
        esac
        [[ -f "$playwright_cli" && ! -L "$playwright_cli" ]]
        "$thumbmux_node_bin" "$playwright_cli" install --with-deps chromium
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
    - name: canonical container e2e
      # Run while the checkout is still the clean exact requested commit.
      # Later build/unit lanes intentionally create ignored artifacts; admitting
      # Docker only before those mutations keeps the source receipt fail-closed
      # without teaching the runtime guard to accept a dirty checkout.
      # run-container owns --forbid-only inside its attested runtime; invoking
      # Playwright directly would bypass the container/run-id guard.
      run: /usr/bin/timeout --kill-after=60s 20m ./e2e/run-container.sh
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        THUMBMUX_E2E_ARTIFACTS: ${{ runner.temp }}/thumbmux-e2e-${{ inputs.e2e-artifact-suffix }}
    - name: retain e2e artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: thumbmux-e2e-${{ inputs.e2e-artifact-suffix }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/thumbmux-e2e-${{ inputs.e2e-artifact-suffix }}
        if-no-files-found: ignore
        retention-days: 7
    # The smoke lane has the same clean-checkout admission as container E2E.
    # Run it before unit/demo/pack lanes can create non-source scratch output;
    # its build also supplies git-dist to the artifact tests below. Moving it
    # later would force the guard to trust a checkout already used by tests.
    - name: root git-dist consumer smoke
      run: bun run build:git-dist && bun run smoke:git-dist
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
    - name: frozen consumer contract gate
      # This lane has the same clean-checkout admission as container E2E and
      # root smoke. It consumes the git-dist built immediately above, so it
      # must run before unit/demo/pack lanes create source-tree scratch output.
      run: ./scripts/contract-fixtures.sh
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
    # Combined process only — no per-workflow split suites. Split suites once
    # gave better failure locality on ci but meant release ran a different
    # process; a DOM-harness / preload interaction can fail under only one
    # process layout. One command, both rails.
    #
    # `--timeout` fails an individual test by name; the step ceiling is the
    # backstop for a wait that belongs to no single test.
    #
    # The ceiling is 60 minutes and that is not padding. This suite installs
    # real consumer fixtures over the network and drives a real browser, and a
    # 2-core runner does not resemble the 16-core box where it finishes in
    # 101 seconds. A first attempt at 15 minutes killed three releases in a
    # row and taught nothing — every "hang" it reported was this step being
    # slow, and cutting it short only removed the evidence.
    - name: unit and contract suites
      # `timeout-minutes` is a WORKFLOW step key — a composite action rejects it
      # outright ("Unexpected value 'timeout-minutes'") and the whole action
      # fails to load. Nothing local catches that: ci-parity runs the commands,
      # not the Actions schema, so this passed every gate here and died on the
      # runner. The ceiling moves into the shell instead, where it means the
      # same thing and is portable.
      run: /usr/bin/timeout --kill-after=60s 60m bun test --timeout 120000 ./server/tests/*.test.ts ./core/tests/*.test.ts ./core/src/*.test.ts ./svelte/tests/*.test.ts ./app/tests/*.test.ts ./demo/*.test.ts ./scripts/*.test.ts
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
    - name: demo builds
      run: cd demo && bun run build
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
    # Publish readiness — was CI-only before the unify. A release that never
    # packs the scoped packages can ship a tree that fails `bun pm pack`.
    - name: packages build & pack (publish readiness)
      run: |
        (cd core && bun run build && bun pm pack)
        (cd server && bun run build && bun pm pack)
        (cd svelte && bun run build && bun pm pack)
        (cd app && bun run build && bun pm pack)
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
    - name: materialize immutable prior contract
      run: |
        baseline_root="$RUNNER_TEMP/thumbmux-contract-baseline"
        bun scripts/materialize-contract-baseline.ts "$baseline_root"
        # Requiring the baseline is the contract check's default; the root is
        # the only thing CI still has to supply.
        echo "THUMBMUX_CONTRACT_BASELINE_ROOT=$baseline_root" >> "$GITHUB_ENV"
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
    - name: public API contract gate
      # Runs against the git-dist built above, not against source: the contract
      # is what a consumer receives. Fails when a public name changes signature
      # or appears without a declared tier.
      run: bun run contract
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
    - name: source integrity after verification
      # Generated outputs are ignored, but no suite may rewrite tracked source
      # or leave an undeclared artifact before release-dist creates its tag.
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        if ! git diff --quiet --no-ext-diff -- \
          || ! git diff --cached --quiet --no-ext-diff --; then
          printf 'verify-gate: tracked/staged source drift after verification\n' >&2
          git diff --name-status -- >&2
          git diff --cached --name-status -- >&2
          exit 1
        fi
        untracked="$(git ls-files --others --exclude-standard)"
        if [[ -n "$untracked" ]]; then
          printf 'verify-gate: undeclared output after verification\n%s\n' "$untracked" >&2
          exit 1
        fi
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
