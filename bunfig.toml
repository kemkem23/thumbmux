# Test runtime for the thumbmux monorepo package.
#
# Preload registers the Svelte compile plugin early (before parallel test-file
# imports resolve `.svelte` paths) and installs happy-dom DOM globals for mount
# tests. Network primitives stay Bun-native — see svelte/tests/preload.ts — so
# core/server keep working when all suites share one `bun test` process.
[test]
preload = ["./svelte/tests/preload.ts"]
