<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="thumbmux architecture flowchart: AI agents in tmux to Bun WebSocket mux, push-on-change diffs, Svelte 5 120Hz viewer, and private Tailscale devices">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#070d18"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="18%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-emerald" cx="85%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track-fwd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="32%" stop-color="#34d399"/>
      <stop offset="65%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="track-rev" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.38"/>
    </pattern>
    <filter id="neon-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pulse-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font: 700 22px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #f8fafc; letter-spacing: -0.02em; }
      .sub { font: 400 12.5px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; }
      .badge-txt { font: 700 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; }
      .col-num { font: 700 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #64748b; letter-spacing: 0.08em; }
      .col-title { font: 700 14.5px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #f1f5f9; }
      .col-sub { font: 500 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7dd3fc; }
      .chip-title { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e2e8f0; }
      .chip-note { font: 400 10.5px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; }
      .stat-lbl { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #cbd5e1; }
      .flow-fwd { stroke-dasharray: 9 7; animation: flowFwd 1.3s linear infinite; }
      .flow-rev { stroke-dasharray: 8 7; animation: flowRev 1.6s linear infinite; }
      .blink-dot { animation: blinkDot 1.8s ease-in-out infinite; }
      .card-breathe { animation: cardGlow 4s ease-in-out infinite; }
      @keyframes flowFwd { to { stroke-dashoffset: -32; } }
      @keyframes flowRev { to { stroke-dashoffset: -30; } }
      @keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes cardGlow { 0%, 100% { stroke-opacity: 0.65; } 50% { stroke-opacity: 1; } }
    </style>
  </defs>

  <!-- Canvas Backdrop -->
  <rect width="1200" height="620" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="620" rx="16" fill="url(#grid)"/>
  <ellipse cx="600" cy="295" rx="520" ry="250" fill="url(#glow-cyan)"/>
  <ellipse cx="180" cy="290" rx="260" ry="220" fill="url(#glow-violet)"/>
  <ellipse cx="1040" cy="290" rx="260" ry="220" fill="url(#glow-emerald)"/>

  <!-- Subtle Outer HUD Frame -->
  <rect x="8" y="8" width="1184" height="604" rx="12" fill="none" stroke="#1e293b" stroke-width="1"/>
  <path d="M 18 32 L 18 18 L 36 18 M 1164 18 L 1182 18 L 1182 32 M 18 588 L 18 602 L 36 602 M 1164 602 L 1182 602 L 1182 588" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Header -->
  <rect x="28" y="24" width="212" height="22" rx="11" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.45"/>
  <text x="134" y="38.5" text-anchor="middle" class="badge-txt" fill="#38bdf8">THUMBMUX STACK · v0.23.2</text>
  <text x="28" y="72" class="title">The tmux Manager for Your Server — Live Data Pipeline</text>
  <text x="28" y="92" class="sub">Zero idle polling waste · Shared multiplexed sessions · Compositor-driven 120Hz viewport over private Tailscale</text>

  <rect x="910" y="30" width="262" height="28" rx="14" fill="#06281e" stroke="#10b981" stroke-opacity="0.55"/>
  <circle cx="928" cy="44" r="4.5" fill="#34d399" class="blink-dot" filter="url(#pulse-glow)"/>
  <text x="942" y="48" class="badge-txt" fill="#6ee7b7">PUSH-ON-CHANGE · NO PUBLIC PORTS</text>

  <!-- Primary Forward Backbone Connector Paths (y=282 behind cards, visible across gaps) -->
  <path id="main-fwd-path" d="M 213 282 L 958 282" fill="none" stroke="url(#track-fwd)" stroke-width="2.5" stroke-opacity="0.72" class="flow-fwd"/>
  <!-- Gap arrowheads -->
  <polygon points="241,282 232,277 232,287" fill="#a855f7"/>
  <polygon points="446,282 437,277 437,287" fill="#34d399"/>
  <polygon points="701,282 692,277 692,287" fill="#22d3ee"/>
  <polygon points="956,282 947,277 947,287" fill="#10b981"/>

  <!-- Column 1: AI Agents & Jobs -->
  <g>
    <rect x="28" y="118" width="185" height="332" rx="12" fill="#0d1322" fill-opacity="0.92" stroke="#a855f7" stroke-width="1.4" class="card-breathe"/>
    <rect x="28" y="118" width="185" height="4" rx="2" fill="#a855f7"/>
    <text x="42" y="140" class="col-num">01 / SERVER PROCS</text>
    <text x="42" y="160" class="col-title">Agents &amp; Jobs</text>
    <text x="42" y="176" class="col-sub" style="fill:#d8b4fe">PTY + ANSI + SGR</text>

    <rect x="40" y="192" width="161" height="50" rx="8" fill="#151d33" stroke="#7e22ce" stroke-opacity="0.5"/>
    <text x="52" y="213" class="chip-title">Claude Code</text>
    <text x="52" y="231" class="chip-note">Interactive TUI + Bash runs</text>

    <rect x="40" y="252" width="161" height="50" rx="8" fill="#151d33" stroke="#7e22ce" stroke-opacity="0.5"/>
    <text x="52" y="273" class="chip-title">OpenAI Codex CLI</text>
    <text x="52" y="291" class="chip-note">Edits · shells · bg waits</text>

    <rect x="40" y="312" width="161" height="50" rx="8" fill="#151d33" stroke="#7e22ce" stroke-opacity="0.5"/>
    <text x="52" y="333" class="chip-title">agy / Gemini / Shell</text>
    <text x="52" y="351" class="chip-note">Long tasks · builds · REPLs</text>

    <rect x="40" y="372" width="161" height="58" rx="8" fill="#151d33" stroke="#7e22ce" stroke-opacity="0.5"/>
    <text x="52" y="393" class="chip-title">Alt-Screen &amp; Unicode</text>
    <text x="52" y="410" class="chip-note">htop · vim · OSC 8 URLs</text>
    <text x="52" y="424" class="chip-note">Thai / CJK / Emoji streams</text>
  </g>

  <!-- Column 2: tmux -->
  <g>
    <rect x="243" y="118" width="175" height="332" rx="12" fill="#0d1322" fill-opacity="0.92" stroke="#34d399" stroke-width="1.4" class="card-breathe"/>
    <rect x="243" y="118" width="175" height="4" rx="2" fill="#34d399"/>
    <text x="257" y="140" class="col-num">02 / PTY HOST</text>
    <text x="257" y="160" class="col-title">tmux Engine</text>
    <text x="257" y="176" class="col-sub" style="fill:#6ee7b7">Persistent sessions</text>

    <rect x="255" y="192" width="151" height="56" rx="8" fill="#102124" stroke="#059669" stroke-opacity="0.55"/>
    <text x="266" y="213" class="chip-title">Exact Targets</text>
    <text x="266" y="230" class="chip-note">=session:0.0 addressing</text>
    <text x="266" y="243" class="chip-note">zero prefix collision</text>

    <rect x="255" y="258" width="151" height="56" rx="8" fill="#102124" stroke="#059669" stroke-opacity="0.55"/>
    <text x="266" y="279" class="chip-title">pipe-pane Trigger</text>
    <text x="266" y="296" class="chip-note">Instant dirty notification</text>
    <text x="266" y="309" class="chip-note">on byte output</text>

    <rect x="255" y="324" width="151" height="50" rx="8" fill="#102124" stroke="#059669" stroke-opacity="0.55"/>
    <text x="266" y="345" class="chip-title">capture-pane</text>
    <text x="266" y="362" class="chip-note">Adaptive poll fallback</text>

    <rect x="255" y="384" width="151" height="46" rx="8" fill="#102124" stroke="#059669" stroke-opacity="0.55"/>
    <text x="266" y="404" class="chip-title">PTY WAL Proxy</text>
    <text x="266" y="420" class="chip-note">Opt-in crash-durable path</text>
  </g>

  <!-- Column 3: Bun Server + Push-on-Change Diff -->
  <g>
    <rect x="448" y="118" width="225" height="332" rx="12" fill="#0d1322" fill-opacity="0.94" stroke="#22d3ee" stroke-width="1.6" filter="url(#neon-soft)"/>
    <rect x="448" y="118" width="225" height="4" rx="2" fill="#22d3ee"/>
    <text x="462" y="140" class="col-num">03 / BUN MUX + DIFF</text>
    <text x="462" y="160" class="col-title">TmuxWsMux Engine</text>
    <text x="462" y="176" class="col-sub">Shared WebSocket + Archive</text>

    <rect x="460" y="192" width="201" height="56" rx="8" fill="#0f2136" stroke="#0284c7" stroke-opacity="0.6"/>
    <text x="472" y="213" class="chip-title">Push-on-Change Diff</text>
    <text x="472" y="230" class="chip-note">Content-hash dedupe · cursor-only</text>
    <text x="472" y="243" class="chip-note">opt-in line deltas &amp; deflate</text>

    <rect x="460" y="258" width="201" height="56" rx="8" fill="#0f2136" stroke="#0284c7" stroke-opacity="0.6"/>
    <text x="472" y="279" class="chip-title">Flat-Cost Broadcast</text>
    <text x="472" y="296" class="chip-note">Shared capture across viewers</text>
    <text x="472" y="309" class="chip-note">backpressure shed (30s / 8 MiB)</text>

    <rect x="460" y="324" width="201" height="50" rx="8" fill="#0f2136" stroke="#0284c7" stroke-opacity="0.6"/>
    <text x="472" y="345" class="chip-title">Durable History</text>
    <text x="472" y="362" class="chip-note">RetentionLane + FileArchive (20k)</text>

    <rect x="460" y="384" width="201" height="46" rx="8" fill="#0f2136" stroke="#0284c7" stroke-opacity="0.6"/>
    <text x="472" y="404" class="chip-title">Routes &amp; Security</text>
    <text x="472" y="420" class="chip-note">createAppRoutes + TokenGuard</text>
  </g>

  <!-- Column 4: Svelte 5 Client Viewer -->
  <g>
    <rect x="703" y="118" width="225" height="332" rx="12" fill="#0d1322" fill-opacity="0.92" stroke="#38bdf8" stroke-width="1.4" class="card-breathe"/>
    <rect x="703" y="118" width="225" height="4" rx="2" fill="#38bdf8"/>
    <text x="717" y="140" class="col-num">04 / SVELTE 5 CLIENT</text>
    <text x="717" y="160" class="col-title">ThumbmuxApp Viewer</text>
    <text x="717" y="176" class="col-sub" style="fill:#bae6fd">120Hz Compositor UI</text>

    <rect x="715" y="192" width="201" height="56" rx="8" fill="#131e33" stroke="#0ea5e9" stroke-opacity="0.5"/>
    <text x="727" y="213" class="chip-title">120Hz Scroll &amp; DOM Text</text>
    <text x="727" y="230" class="chip-note">translate3d · 60-row overscan</text>
    <text x="727" y="243" class="chip-note">select, copy, tappable URLs</text>

    <rect x="715" y="258" width="201" height="56" rx="8" fill="#131e33" stroke="#0ea5e9" stroke-opacity="0.5"/>
    <text x="727" y="279" class="chip-title">Agent TOOLS Folding</text>
    <text x="727" y="296" class="chip-note">SHOW / HIDE / DISTILL views</text>
    <text x="727" y="309" class="chip-note">Claude &amp; Codex · raw copy kept</text>

    <rect x="715" y="324" width="201" height="50" rx="8" fill="#131e33" stroke="#0ea5e9" stroke-opacity="0.5"/>
    <text x="727" y="345" class="chip-title">ComposerDock + Keys</text>
    <text x="727" y="362" class="chip-note">COMPOSE / DIRECT · shortcuts</text>

    <rect x="715" y="384" width="201" height="46" rx="8" fill="#131e33" stroke="#0ea5e9" stroke-opacity="0.5"/>
    <text x="727" y="404" class="chip-title">SessionGrid + Search</text>
    <text x="727" y="420" class="chip-note">Live tail tiles · 10k row window</text>
  </g>

  <!-- Column 5: Tailscale & Devices -->
  <g>
    <rect x="958" y="118" width="214" height="332" rx="12" fill="#0d1322" fill-opacity="0.92" stroke="#10b981" stroke-width="1.4" class="card-breathe"/>
    <rect x="958" y="118" width="214" height="4" rx="2" fill="#10b981"/>
    <text x="972" y="140" class="col-num">05 / PRIVATE ACCESS</text>
    <text x="972" y="160" class="col-title">Phone &amp; Desktop</text>
    <text x="972" y="176" class="col-sub" style="fill:#6ee7b7">Over Tailscale</text>

    <rect x="970" y="192" width="190" height="68" rx="8" fill="#0d221c" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="982" y="213" class="chip-title" style="fill:#6ee7b7">Tailscale Encrypted Mesh</text>
    <text x="982" y="230" class="chip-note">Loopback bind + tailscale serve</text>
    <text x="982" y="244" class="chip-note">No public ports · auto HTTPS</text>

    <rect x="970" y="270" width="190" height="74" rx="8" fill="#111b2b" stroke="#334155"/>
    <text x="982" y="291" class="chip-title">Mobile (390px iOS/Android)</text>
    <text x="982" y="308" class="chip-note">One-thumb dock, D-pad, gestures</text>
    <text x="982" y="322" class="chip-note">Instant paste + image upload</text>
    <text x="982" y="336" class="chip-note">Thai IME &amp; CJK cell accuracy</text>

    <rect x="970" y="354" width="190" height="76" rx="8" fill="#111b2b" stroke="#334155"/>
    <text x="982" y="375" class="chip-title">Desktop Browser</text>
    <text x="982" y="392" class="chip-note">DesktopKeys + xterm encoder</text>
    <text x="982" y="406" class="chip-note">Ctrl+C selection copy / SIGINT</text>
    <text x="982" y="420" class="chip-note">SGR mouse trackpad wheel/drag</text>
  </g>

  <!-- Return Input Control Loop (Right -> Left) -->
  <g>
    <path id="input-rev-path" d="M 1065 450 L 1065 504 L 330 504 L 330 454" fill="none" stroke="url(#track-rev)" stroke-width="2.2" stroke-opacity="0.82" class="flow-rev"/>
    <polygon points="330,452 325,462 335,462" fill="#a855f7"/>
    <rect x="395" y="489" width="590" height="30" rx="15" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.65"/>
    <text x="690" y="508" text-anchor="middle" class="badge-txt" fill="#fcd34d">INPUT CONTROL LOOP ← Keystrokes · submitPlan() · Paste · Resize · Spawn</text>
  </g>

  <!-- SMIL Animated Glowing Pulses (work natively in GitHub SVG <img>) -->
  <circle r="5" fill="#22d3ee" filter="url(#pulse-glow)">
    <animateMotion dur="4.2s" repeatCount="indefinite" begin="0s">
      <mpath href="#main-fwd-path"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#34d399" filter="url(#pulse-glow)">
    <animateMotion dur="4.2s" repeatCount="indefinite" begin="1.4s">
      <mpath href="#main-fwd-path"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#a855f7" filter="url(#pulse-glow)">
    <animateMotion dur="4.2s" repeatCount="indefinite" begin="2.8s">
      <mpath href="#main-fwd-path"/>
    </animateMotion>
  </circle>

  <circle r="4.5" fill="#fbbf24" filter="url(#pulse-glow)">
    <animateMotion dur="3.8s" repeatCount="indefinite" begin="0.4s">
      <mpath href="#input-rev-path"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#c084fc" filter="url(#pulse-glow)">
    <animateMotion dur="3.8s" repeatCount="indefinite" begin="2.3s">
      <mpath href="#input-rev-path"/>
    </animateMotion>
  </circle>

  <!-- Footer Verified Metrics Bar -->
  <rect x="28" y="544" width="1144" height="44" rx="10" fill="#0b111e" stroke="#1e293b"/>
  <circle cx="52" cy="566" r="3.5" fill="#22d3ee"/>
  <text x="64" y="570" class="stat-lbl">core: 0 runtime deps (10,605 LOC TS)</text>
  <circle cx="348" cy="566" r="3.5" fill="#34d399"/>
  <text x="360" y="570" class="stat-lbl">Overscan: 60 rows / side</text>
  <circle cx="578" cy="566" r="3.5" fill="#38bdf8"/>
  <text x="590" y="570" class="stat-lbl">Client retention: 10,000 rows or 8 MiB</text>
  <circle cx="892" cy="566" r="3.5" fill="#a855f7"/>
  <text x="904" y="570" class="stat-lbl">Archive: 20,000 lines / session default</text>
</svg>
